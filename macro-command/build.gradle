plugins {
    id 'java'
}

group = 'org.otus.alex'
version = '1.0-SNAPSHOT'

repositories {
    mavenCentral()
}

dependencies {
    testImplementation platform('org.junit:junit-bom:5.10.0')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    implementation project(':command-exceptions')
    implementation project(':moving-objects')
}

test {
    useJUnitPlatform {
        includeTags 'macro-command'
    }
}